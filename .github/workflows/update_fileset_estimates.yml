name: "Update fileset estimates"
on:
  workflow_dispatch:

jobs:
  update-fileset-estimates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
        
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          pip install "metomi-isodatetime==1!3.0.0"
          pip install "requests==2.34.2"

      - name: update fileset estimates
        id: update-fileset-estimates
        run: python scripts/fileset_storage_estimate.py

      - name: commit files
        id: commit-files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add *.txt
          git commit -m "Update fileset storage estimates" || echo "No new changes to commit"
          git push origin main
