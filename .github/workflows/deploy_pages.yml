name: "Deploy pages"
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
      - name : Checkout
        uses : actions/checkout@v4
        with :
          ref : main

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
  
      - name: install dependencies
        run: |
          pip install requests==2.34.2
          pip install mike==2.0.0
          pip install pymdown-extensions==10.7.1
          pip install mkdocs==1.5.3
          pip install mkdocs-autorefs==1.0.1
          pip install mkdocs-gen-files==0.4.0
          pip install mkdocs-literate-nav==0.4.1
          pip install mkdocs-material==8.5.11
          pip install mkdocs-material-extensions==1.3.1
          pip install mkdocs-section-index==0.3.10
          pip install mkdocstrings==0.24.1
          pip install mkdocstrings-python==1.9.0

      - name: update html
        run: |
          python scripts/generate_metadata_tables.py
          python scripts/metadata_per_mip.py

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add *.html *.md
          git commit -m "Update mkdocs pages" || echo "No new changes to commit"
          git push origin main

      - name: trigger deployment
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          mike deploy docs
          git push origin gh-pages