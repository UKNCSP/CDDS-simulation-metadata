name: "Generate variable lists"
on:
  workflow_run:
    workflows: ["Process new metadata entry"]
    types:
      - completed
  workflow_dispatch: 

jobs:
  generate-variable-lists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
        
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: get commit
        id: get-commit
        run: |
          FILE=$(git show --name-only --pretty="" HEAD | head -n 1)
          echo "last committed file --> $FILE"

          WORKFLOW_ID_LINE=$(grep "model_workflow_id = " $FILE)
          read _ _ WORKFLOW_ID <<< "$WORKFLOW_ID_LINE"
          echo "workflow_id=$WORKFLOW_ID" >> $GITHUB_OUTPUT

          EXPERIMENT_LINE=$(grep -v "parent_experiment_id = " $FILE | grep "experiment_id = ")
          read _ _ EXPERIMENT <<< "$EXPERIMENT_LINE"
          echo "experiment=$EXPERIMENT" >> $GITHUB_OUTPUT

          MODEL_LINE=$(grep -v "parent_model_id = " $FILE | grep "model_id = ")
          read _ _ MODEL <<< "$MODEL_LINE"
          echo "model=$MODEL" >> $GITHUB_OUTPUT

          echo "Creating variable list for $EXPERIMENT under $MODEL"

      - name: create variable list
        id: create-variable-list
        run: |
          python scripts/generate_variable_lists.py "${{ steps.get-commit.outputs.workflow_id }}" "${{ steps.get-commit.outputs.experiment }}" "${{ steps.get-commit.outputs.model }}"

      - name: commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add *.txt
          git commit -m "New variable list file added for experiment ${{ steps.get-commit.outputs.experiment }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
