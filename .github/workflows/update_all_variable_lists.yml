name: "Update all variable lists"
on:
  workflow_dispatch:

jobs:
  update-all-variable-lists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
        
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          pip install "requests==2.34.2"

      - name: update variable lists
        id: update_variable_lists
        run: python scripts/update_all_variable_lists.py

      - name: commit files
        id: commit-files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add *.txt
          git commit -m "Update all variable lists" || echo "No new changes to commit"
          git push origin main
